<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Rafael">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14130f"/>
      <stop offset="1" stop-color="#0b0b0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="45%">
      <stop offset="0" stop-color="#b8975a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b8975a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="col" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f8a7c"/>
      <stop offset="0.45" stop-color="#ece7da"/>
      <stop offset="1" stop-color="#6f6b60"/>
    </linearGradient>
    <pattern id="noise" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" x="1" y="2" fill="#ece7da" opacity="0.05"/>
      <rect width="1" height="1" x="4" y="5" fill="#ece7da" opacity="0.04"/>
      <rect width="1" height="1" x="3" y="0" fill="#ece7da" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#noise)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>

  <!-- side inscriptions -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#b8975a" letter-spacing="10" font-size="17" text-anchor="middle">
    <text x="190" y="182">ΙΣΧΥΣ</text>
    <text x="1010" y="182">ΚΑΛΛΟΣ</text>
  </g>
  <g stroke="#b8975a" stroke-opacity="0.5" stroke-width="1">
    <line x1="90" y1="198" x2="290" y2="198"/>
    <line x1="910" y1="198" x2="1110" y2="198"/>
  </g>


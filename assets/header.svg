      <rect x="708.4" y="140" width="40" height="8" fill="#ece7da"/>
      <rect x="714.4" y="148" width="28" height="150" fill="url(#col)"/>
      <g stroke="#14130f" stroke-opacity="0.35" stroke-width="1">
        <line x1="720.4" y1="148" x2="720.4" y2="298"/><line x1="728.4" y1="148" x2="728.4" y2="298"/><line x1="736.4" y1="148" x2="736.4" y2="298"/>
      </g>
